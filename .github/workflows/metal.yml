name: metal-userland

on:
  workflow_dispatch:
  push:
    paths:
      - "metal/**"
      - "phone/**"
      - ".github/workflows/metal.yml"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          brew install bison flex llvm meson ninja glslang >/dev/null
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Build userland
        run: |
          chmod +x metal/build-userland.sh
          metal/build-userland.sh

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metal-userland
          path: |
            out/SweetMetal2.bundle
            out/libvulkan_freedreno.dylib
            out/v2test
          if-no-files-found: warn
          include-hidden-files: true
